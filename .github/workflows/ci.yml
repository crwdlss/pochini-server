name: CI

on:
  push:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - name: Скачать код
      uses: actions/checkout@v5

    - name: Проверка
      run: echo "CI good"


    - name: Собрать базовый образ
      run: docker build -t pochini-base base


    - name: Собрать образы всех задач
      run: |
        for d in tasks/*/; do
          name=$(basename "$d")
          echo "=== собираю $name"
          docker build -t "pochini-$name" --build-arg TASK="$name" -f base/Dockerfile.task .
        done

